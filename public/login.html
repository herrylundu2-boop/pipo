<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pipo">
<style>
  :root{--bg:#FDF0F5;--surface:#fff;--ink:#3A2430;--muted:#7A5F6B;--line:#F2D3DF;--accent:#D4508A}
  @media (prefers-color-scheme:dark){:root{--bg:#24161C;--surface:#33212A;--ink:#F8E9EF;--muted:#C9A9B6;--line:#4A3039;--accent:#C2457C;color-scheme:dark}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:18px/1.4 Verdana,system-ui,sans-serif;padding:16px;box-sizing:border-box}
  form{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:24px}
  p{margin:0;color:var(--muted);font-size:15px}
  input{font:inherit;font-size:22px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.2em}
  button{font:inherit;font-weight:700;padding:12px;border-radius:999px;border:0;background:var(--accent);color:#fff}
  .err{color:#C0392B;min-height:1.2em}
</style>
</head>
<body>
<form id="f">
  <h1>Pipo</h1>
  <p>Parents: enter the family code once. This iPad will remember it.</p>
  <input id="code" type="password" inputmode="numeric" autocomplete="off" aria-label="Family code" required>
  <button>Open Pipo</button>
  <p class="err" id="err"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ code: document.getElementById('code').value }) });
  if (r.ok) location.href = '/'; else err.textContent = 'That code is not right. Try again.';
});
</script>
</body>
</html>
